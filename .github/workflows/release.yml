on:
  release:
    types: [published]

permissions:
  # Required for MCP Publisher for publishing using OIDC
  id-token: write

name: publish
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Check version consistency
        run: npm run sync-version check
      - run: npm run build
      
      - run: npm publish --access=public
        if: ${{!github.event.release.prerelease}}
      - run: npm publish --tag prerelease
        if: ${{github.event.release.prerelease}}

      # Publish to MCP Registry only for non-prerelease releases
      - name: Install MCP Publisher
        if: ${{!github.event.release.prerelease}}
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
          # SHA-256 of mcp-publisher_linux_amd64.tar.gz for the pinned version above.
          # Recompute from the upstream release and update both values together when bumping.
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          set -euo pipefail
          asset="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --remote-name "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/${asset}"
          echo "${MCP_PUBLISHER_SHA256}  ${asset}" | sha256sum --check -
          tar -xzf "${asset}" mcp-publisher
      
      - name: Login to MCP Registry
        if: ${{!github.event.release.prerelease}}
        run: |
          ./mcp-publisher login github-oidc
              
      - name: Publish to MCP Registry
        if: ${{!github.event.release.prerelease}}
        run: |
          ./mcp-publisher publish